[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-research"
version = "0.1.0"
description = "Reproducible research platform for protected continual learning"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.11,<2", "torch>=2.4,<3", "PyYAML>=6", "cryptography>=42"]

[project.optional-dependencies]
media = ["faster-whisper>=1.1", "pytesseract>=0.3", "Pillow>=10"]
language = ["transformers>=4.45,<6"]
gpu = ["triton>=3.0; platform_system == 'Linux'"]
dev = ["pytest>=8", "maturin>=1.7,<2", "matplotlib>=3.8", "torchvision>=0.19"]

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools.packages.find]
include = ["nova*", "experiments*"]
exclude = ["nova-core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
