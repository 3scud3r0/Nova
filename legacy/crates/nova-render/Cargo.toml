[package]
name = "nova-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nova-substrates = { path = "../nova-substrates" }
nova-cognition = { path = "../nova-cognition" }
nova-core = { path = "../nova-core" }
nova-physics = { path = "../nova-physics" }
nova-gpu = { path = "../nova-gpu" }
anyhow.workspace = true
bytemuck.workspace = true
wgpu.workspace = true
pollster.workspace = true
winit = { version = "0.29", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[dependencies.nova-storage]
path = "../nova-storage"

[build-dependencies]
naga = { version = "0.19.2", features = ["wgsl-in"] }

[dependencies.egui]
version = "0.27"
[dependencies.egui-winit]
version = "0.27"
[dependencies.egui-wgpu]
version = "0.27"
[dependencies.nova-fusion]
path = "../nova-fusion"
[dependencies.serde_json]
workspace = true
