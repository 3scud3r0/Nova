name: native-builds
on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "third_party/**", "LICENSE", "THIRD_PARTY_NOTICES.md", "docs/native/**", "artifacts/**", "src/**", "nova_engine/**", "scripts/package_native.py", ".github/workflows/native.yml"]
  workflow_dispatch:
  push:
    tags: ["native-v*"]
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - name: Static MSVC runtime
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build executable and C ABI
        run: cargo build --release --locked -p nova-engine -p nova-ffi
      - name: Compile source examples, without execution
        run: cargo check --locked --examples
      - name: Package native assets
        run: python scripts/package_native.py --label ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.label }}
          path: dist/*
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - run: pip install 'maturin>=1.7,<2'
      - run: maturin build --release --locked -o ../../dist/wheels
        working-directory: crates/nova-python
      - uses: actions/upload-artifact@v4
        with:
          name: nova-python-linux-cp312
          path: dist/wheels/*
  publish:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [binaries, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tagged native release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
