[package]
name = "nova-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.23.5"
numpy = "0.23.0"
rayon = "1.10"

[features]
default = []
webgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies.wgpu]
version = "=0.19.4"
optional = true

[dependencies.pollster]
version = "0.3"
optional = true

[dependencies.bytemuck]
version = "1.21"
features = ["derive"]
optional = true

[build-dependencies]
naga = { version = "=0.19.2", features = ["wgsl-in"] }
