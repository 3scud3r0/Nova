<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Atlas científico</title>
<style>body{margin:0;background:#080e1e;color:#d9edf5;font:14px system-ui}header{padding:20px;position:absolute;top:0;pointer-events:none}h1{margin:0}p{color:#99b7ca;max-width:650px;line-height:1.5}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;right:15px;top:15px;width:350px;max-height:90vh;overflow:auto;background:#0c192bed;border:1px solid #33506b;border-radius:10px;padding:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#9bd9eb}button{color:#ddf4ff;background:#19394c;padding:8px;border:1px solid #50839b;border-radius:5px}</style>
<canvas id="map"></canvas><header><h1>Atlas NOVA</h1><p>Linhagens, nichos e evidências observadas. A posição no mapa organiza o arquivo; não representa geografia nem uma métrica de verdade. Arraste para girar e selecione um ponto.</p><a href="/">Voltar ao bioma</a></header><aside><button id="refresh">Atualizar</button><p id="status"></p><pre id="details"></pre></aside><script>
'use strict';let DATA=/*ATLAS_DATA*/null,LIVE=/*ATLAS_LIVE*/false;
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');let nodes=[],selected=null,yaw=.4,pitch=.25,drag=null;
function load(data){DATA=data;nodes=[];const groups=[['lineage',data.ancestry?.lineages||[],'#75c7a0'],['discovery',data.discoveries||[],'#e3c66e'],['proof',data.proofs||[],'#a7a4ff'],['migration',data.migrations||[],'#6dc4e2']];let i=0;for(const [kind,records,color] of groups)for(const record of records){let angle=i*2.399963,rad=45*Math.sqrt(i+1);nodes.push({kind,record,color,p:[Math.cos(angle)*rad,Math.sin(angle)*rad,((i%17)-8)*25]});i++;}document.querySelector('#status').textContent=`${data.status||'arquivo'} · ${data.routing_peers||0} pares na tabela local · ${nodes.length} registros`;document.querySelector('#details').textContent=JSON.stringify({simulation:data.simulation,communications:data.communications,scope:data.network_scope},null,2);}
async function refresh(){if(!LIVE)return;try{const r=await fetch('/atlas.json',{cache:'no-store'});if(!r.ok)throw Error('Atlas indisponível');load(await r.json());}catch(e){document.querySelector('#status').textContent=e.message;}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.005;pitch+=(e.clientY-drag[1])*.005;drag=[e.clientX,e.clientY];};canvas.onpointerup=e=>{drag=null;const pick=nodes.find(n=>n.screen&&Math.hypot(n.screen[0]-e.clientX,n.screen[1]-e.clientY)<14);if(pick){selected=pick;document.querySelector('#details').textContent=JSON.stringify({kind:pick.kind,...pick.record},null,2);}};
function project(p){const x=Math.cos(yaw)*p[0]+Math.sin(yaw)*p[2],z=-Math.sin(yaw)*p[0]+Math.cos(yaw)*p[2],y=Math.cos(pitch)*p[1]-Math.sin(pitch)*z;const scale=700/(1000+Math.sin(pitch)*p[1]+Math.cos(pitch)*z);return [canvas.width*.42+x*scale,canvas.height*.55+y*scale];}
function draw(){canvas.width=innerWidth;canvas.height=innerHeight;ctx.clearRect(0,0,canvas.width,canvas.height);const lineage=new Map(nodes.filter(n=>n.kind==='lineage').map(n=>[n.record.genome,n]));for(const n of nodes)n.screen=project(n.p);ctx.strokeStyle='#3a687855';for(const n of nodes)for(const parent of n.record.parents||[]){const p=lineage.get(parent);if(p){ctx.beginPath();ctx.moveTo(...n.screen);ctx.lineTo(...p.screen);ctx.stroke();}}for(const n of nodes){ctx.beginPath();ctx.fillStyle=n.color;ctx.arc(...n.screen,n===selected?8:4,0,7);ctx.fill();}requestAnimationFrame(draw);}document.querySelector('#refresh').onclick=refresh;if(DATA)load(DATA);refresh();if(LIVE)setInterval(refresh,3000);draw();
</script></html>
