<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>NOVA · WebGPU</title><style>body{margin:0;background:#070d1b;color:#dceef7;font:14px system-ui}canvas{width:100vw;height:100vh;display:block;touch-action:none}aside{position:absolute;left:20px;top:20px;background:#0c1930e8;padding:18px;border-radius:12px;max-width:330px;max-height:85vh;overflow:auto}pre{white-space:pre-wrap}button,a{color:#bde5ff}button{background:#18394f;padding:8px;border:1px solid #4e7591}</style><canvas></canvas><aside><h2>NOVA · WebGPU</h2><p>Arraste para orbitar. Volume ilustrativo. Compute nativo e renderização são backends distintos.</p><button id="step">+1 tick</button> <button id="play">Continuar</button><p><a href="/atlas">Atlas científico</a></p><pre id="stats"></pre><pre id="communication"></pre><p id="error"></p></aside><script type="module">
const INITIAL=/*INITIAL_FRAME*/null,LIVE=/*LIVE_CONFIG*/null;const error=document.querySelector('#error');
try{
if(!navigator.gpu)throw Error('WebGPU indisponível neste navegador; selecione --renderer webgl.');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('Nenhum adaptador WebGPU.');const device=await adapter.requestDevice();const canvas=document.querySelector('canvas'),context=canvas.getContext('webgpu'),format=navigator.gpu.getPreferredCanvasFormat();context.configure({device,format,alphaMode:'opaque'});
const code=`struct Params{eye:vec4<f32>,view:vec4<f32>};@group(0) @binding(0) var volume:texture_3d<f32>;@group(0) @binding(1) var linear:sampler;@group(0) @binding(2) var<uniform> cfg:Params;struct Out{@builtin(position) p:vec4<f32>,@location(0) uv:vec2<f32>};@vertex fn vs(@builtin(vertex_index) i:u32)->Out{var p=array<vec2<f32>,3>(vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));var out:Out;out.p=vec4(p[i],0.,1.);out.uv=p[i];return out;}fn density(p:vec3<f32>)->f32{return textureSampleLevel(volume,linear,p*.5+.5,0.).r;}@fragment fn fs(in:Out)->@location(0) vec4<f32>{let eye=cfg.eye.xyz;let forward=normalize(-eye);let right=normalize(cross(forward,vec3(0.,1.,0.)));let up=cross(right,forward);let ray=normalize(forward*1.9+right*in.uv.x*cfg.view.x/cfg.view.y+up*in.uv.y);let a=(-vec3(1.)-eye)/ray;let b=(vec3(1.)-eye)/ray;let lo=min(a,b);let hi=max(a,b);let begin=max(max(lo.x,lo.y),max(lo.z,0.));let end=min(min(hi.x,hi.y),hi.z);var color=vec3(0.);var trans=1.;if(end>begin){let ds=(end-begin)/160.;for(var i=0;i<160;i++){let p=eye+ray*(begin+(f32(i)+.5)*ds);let d=density(p);let alpha=1.-exp(-d*ds*10.);let light=.4+.6*density(clamp(p+vec3(.05),vec3(-1.),vec3(1.)));color+=trans*alpha*mix(vec3(.12,.5,.8),vec3(1.,.8,.4),d)*light;trans*=1.-alpha;if(trans<.01){break;}}}return vec4(pow(color+trans*vec3(.02,.03,.06),vec3(.8)),1.);}`;
const module=device.createShaderModule({code});const compilation=await module.getCompilationInfo();if(compilation.messages.some(m=>m.type==='error'))throw Error(compilation.messages.map(m=>m.message).join('\n'));const pipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}});const sampler=device.createSampler({magFilter:'linear',minFilter:'linear'}),uniform=device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});let texture=null,group=null,busy=false,running=false,yaw=.7,pitch=.35,drag=null;
function update(frame){const [z,y,x]=frame.shape,raw=Uint8Array.from(atob(frame.volume),c=>c.charCodeAt(0));if(texture)texture.destroy();texture=device.createTexture({size:[x,y,z],dimension:'3d',format:'r8unorm',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});const stride=Math.ceil(x/256)*256,padded=new Uint8Array(stride*y*z);for(let i=0;i<y*z;i++)padded.set(raw.subarray(i*x,(i+1)*x),i*stride);device.queue.writeTexture({texture},padded,{bytesPerRow:stride,rowsPerImage:y},[x,y,z]);group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView({dimension:'3d'})},{binding:1,resource:sampler},{binding:2,resource:{buffer:uniform}}]});document.querySelector('#stats').textContent=JSON.stringify(frame.metrics,null,2);document.querySelector('#communication').textContent=JSON.stringify(frame.communications||{},null,2);}
async function step(){if(!LIVE||busy)return;busy=true;try{const r=await fetch('/step',{method:'POST',headers:{'Content-Type':'application/json','X-Nova-Session':LIVE.token},body:'{"ticks":1}'});if(!r.ok)throw Error(await r.text());update(await r.json());}catch(e){error.textContent=e.message;running=false;}finally{busy=false;}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];}};canvas.onpointerup=()=>drag=null;
document.querySelector('#step').onclick=step;document.querySelector('#play').onclick=()=>{running=!running;if(LIVE?.autonomous)fetch('/control',{method:'POST',headers:{'Content-Type':'application/json','X-Nova-Session':LIVE.token},body:JSON.stringify({paused:!running})});};if(!LIVE){document.querySelector('#step').disabled=true;document.querySelector('#play').disabled=true;}if(INITIAL)update(INITIAL);let last=0;if(LIVE?.autonomous){running=true;setInterval(async()=>{if(busy)return;try{const r=await fetch('/frame');if(r.ok)update(await r.json());}catch(e){error.textContent=e.message;}},500);}
function draw(time){const w=Math.floor(Math.min(innerWidth*devicePixelRatio,1920)),h=Math.floor(Math.min(innerHeight*devicePixelRatio,1080));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}device.queue.writeBuffer(uniform,0,new Float32Array([3.5*Math.cos(pitch)*Math.sin(yaw),3.5*Math.sin(pitch),3.5*Math.cos(pitch)*Math.cos(yaw),0,canvas.width,canvas.height,0,0]));if(group){const encoder=device.createCommandEncoder(),pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:.02,g:.03,b:.06,a:1},loadOp:'clear',storeOp:'store'}]});pass.setPipeline(pipeline);pass.setBindGroup(0,group);pass.draw(3);pass.end();device.queue.submit([encoder.finish()]);}if(running&&!LIVE?.autonomous&&time-last>150){last=time;step();}requestAnimationFrame(draw);}draw(0);
}catch(e){error.textContent=e.message;}
</script></html>
